name: Docker Build and Push

on:
  push:
    branches: [main]
    paths: ["ecowitt-proxy/**", ".github/workflows/builder.yaml"]
  pull_request:
    branches: [main]
    paths: ["ecowitt-proxy/**", ".github/workflows/builder.yaml"]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: amd64, platform: linux/amd64}
          - {name: arm64, platform: linux/arm64}
          - {name: armv7, platform: linux/arm/v7}
          - {name: armv6, platform: linux/arm/v6}
          - {name: "386", platform: linux/386}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: startsWith(matrix.platform, 'linux/arm')
        with:
          image: tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Build a fresh platform image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker buildx build --pull --no-cache --platform "$PLATFORM" \
            --tag ecowitt-proxy:ci --output type=docker,dest=image.tar \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" ecowitt-proxy

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: image.tar
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          cache: "false"

      - name: Run the container smoke test
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker load --input image.tar
          docker run --rm --platform "$PLATFORM" --network none \
            --volume "$PWD/ecowitt-proxy/tests:/tests:ro" \
            -e HA_WEBHOOK_ID=ci-webhook -e HA_AUTH_TOKEN=ci-legacy-token \
            --entrypoint /bin/sh ecowitt-proxy:ci -ec '
              ./run.sh >/tmp/proxy.log 2>&1 &
              proxy=$!
              trap "kill $proxy 2>/dev/null || true" EXIT
              for attempt in $(seq 30); do
                if wget -q -O /dev/null http://127.0.0.1:8082/; then
                  if grep -Fq ci-webhook /tmp/proxy.log; then
                    echo "Startup logs include the webhook ID" >&2
                    exit 1
                  fi
                  PYTHONPATH=/app python -m unittest discover -s /tests -v
                  exit 0
                fi
                kill -0 "$proxy"
                sleep 1
              done
              echo "The proxy did not start" >&2
              exit 1
            '

      - name: Save the checked image
        run: sha256sum image.tar > image.tar.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.name }}
          path: |
            image.tar
            image.tar.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 3

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images

      - name: Verify the checked image archives
        run: |
          for platform in amd64 arm64 armv7 armv6 386; do
            (cd "images/image-$platform" && sha256sum -c image.tar.sha256)
          done

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the checked images as a multi-platform manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$image:sha-${GITHUB_SHA:0:7}"
          platforms=(amd64 arm64 armv7 armv6 386)
          refs=()
          for platform in "${platforms[@]}"; do
            docker load --input "images/image-$platform/image.tar"
            staging="$image:build-$platform"
            docker tag ecowitt-proxy:ci "$staging"
            digest=$(docker push "$staging" | tee /dev/stderr | awk '/digest: sha256:/ {print $3}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            refs+=("$image@$digest")
          done

          docker manifest create "$version" "${refs[@]}"
          docker manifest annotate "$version" "${refs[0]}" --os linux --arch amd64
          docker manifest annotate "$version" "${refs[1]}" --os linux --arch arm64
          docker manifest annotate "$version" "${refs[2]}" --os linux --arch arm --variant v7
          docker manifest annotate "$version" "${refs[3]}" --os linux --arch arm --variant v6
          docker manifest annotate "$version" "${refs[4]}" --os linux --arch 386
          docker manifest push "$version"
          docker buildx imagetools create --tag "$image:main" --tag "$image:latest" "$version"
